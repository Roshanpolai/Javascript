<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style=" background-color: black; color: white;">

    <ul id="fruit">
        <li>Apple</li>
        <li>Banana</li>
    </ul>
</body>

<script>
    function addFruits(fruit) {
        // Create new List 
        const li = document.createElement('li');
        // Add value to thie list 
        li.innerText = fruit;

        // Acsess the root list
        const list = document.getElementById('fruit');
        // Append new list in to root list
        list.append(li);
    }

    addFruits("Orange")
    addFruits("Banana")
</script>

</html>
